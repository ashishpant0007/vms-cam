<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gatekeeper VMS — Camera</title>
</head>
<body style="font-family:sans-serif;text-align:center;margin:0;padding:16px">
  <h3>Take the visitor's photo</h3>
  <video id="v" autoplay playsinline muted style="width:100%;max-width:480px;background:#000"></video><br>
  <button id="snap" style="padding:10px 24px;margin-top:10px;font-size:16px">Capture</button>
  <p id="err" style="color:#b00"></p>
  <canvas id="c" hidden></canvas>
<script>
  const parentOrigin = new URLSearchParams(location.search).get('o') || '';
  const okOrigin = /^https:\/\/([a-z0-9-]+\.)*(googleusercontent|google)\.com$/.test(parentOrigin);
  const v = document.getElementById('v'), c = document.getElementById('c');

  navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } })
    .then(s => v.srcObject = s)
    .catch(e => document.getElementById('err').textContent = 'Camera error: ' + e.message);

  document.getElementById('snap').onclick = () => {
    if (!okOrigin || !window.opener) {
      document.getElementById('err').textContent = 'Open this from the VMS page. (origin: ' + parentOrigin + ')';
      return;
    }
    const w = 640, h = Math.round(640 * v.videoHeight / v.videoWidth);
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(v, 0, 0, w, h);
    const dataUrl = c.toDataURL('image/jpeg', 0.8);
    window.opener.postMessage({ type: 'gatekeeper-photo', dataUrl }, parentOrigin);
    v.srcObject.getTracks().forEach(t => t.stop());
    window.close();
  };
</script>
</body>
</html>
